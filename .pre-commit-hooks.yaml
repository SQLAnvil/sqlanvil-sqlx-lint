# Hook definition consumed by pre-commit when this repo is referenced
# in a project's .pre-commit-config.yaml.
- id: sqlanvil-sqlx-lint
  name: SQLAnvil SQLX Convention Lint
  description: Checks SQLAnvil .sqlx config-block, project-convention, and sqlanvil-delta rules
  entry: sqlanvil-sqlx-lint
  language: python
  files: \.sqlx$
